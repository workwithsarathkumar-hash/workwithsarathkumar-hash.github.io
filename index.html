<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarath Kumar — Back shortly</title>
<style>
  :root{
    --bg:#0B0C0E; --surface:#131418; --text:#EFEDE8;
    --text-soft:#A8A6A0; --accent:#C9A55C; --border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);text-align:center;padding:24px;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  .card{max-width:460px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:2rem;margin:0 0 14px;}
  h1 span{color:var(--accent);font-style:italic;}
  p{color:var(--text-soft);line-height:1.6;margin:0 0 24px;}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  a{
    display:inline-block;padding:9px 16px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);color:var(--text-soft);
    text-decoration:none;font-size:0.85rem;font-weight:600;
    transition:border-color 0.15s ease,color 0.15s ease;
  }
  a:hover{border-color:rgba(201,165,92,0.32);color:var(--accent);}
  .meta{margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:0.76rem;color:#6E6C67;}
</style>
</head>
<body>
  <div class="card">
    <h1>Back <span>shortly</span>.</h1>
    <p>Making some changes. The site's down for a moment, not gone — check back soon.</p>
    <div class="links">
      <a href="https://www.linkedin.com/in/sarath-kumar-3b621316b" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/workwithsarathkumar-hash" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="meta">build first, refine live</div>
  </div>
</body>
</html>
